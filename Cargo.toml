[package]
name = "taskflow"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }

[dependencies.uuid]
version = "1.23.2"
features = ["serde", "v4"]

