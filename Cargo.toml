[package]
name = "taskflow"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
async-trait = "0.1.92"
sqlx = { version = "0.9.0", features = ["postgres", "macros", "runtime-tokio", "uuid"] }

[dependencies.uuid]
version = "1.23.2"
features = ["serde", "v4"]

[env]
SQLX_OFFLINE = "true"